<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convex — AutoML and Model Risk Management</title>
    <meta
      name="description"
      content="Convex is an AutoML platform that unifies model development, governance and auditing on a single platform, from data preparation to deployment and monitoring."
    />

    <!-- Open Graph / Twitter — statik varsayılanlar; her rota kendi <title> ve
         description'ını src/router/index.js'teki afterEach hook'uyla ayarlıyor,
         ancak bu site SSR/prerender kullanmadığından paylaşım kartlarında (link
         önizlemesi) hâlâ bu varsayılanlar görünür. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Convex" />
    <meta property="og:title" content="Convex — AutoML and Model Risk Management" />
    <meta
      property="og:description"
      content="Convex is an AutoML platform that unifies model development, governance and auditing on a single platform, from data preparation to deployment and monitoring."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Convex — AutoML and Model Risk Management" />
    <meta
      name="twitter:description"
      content="Convex is an AutoML platform that unifies model development, governance and auditing on a single platform, from data preparation to deployment and monitoring."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
