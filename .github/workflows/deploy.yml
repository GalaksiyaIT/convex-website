name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Türkçe seçeneğini açmak için repo Settings → Secrets and variables → Actions →
          # Variables altında VITE_ENABLE_TURKISH=true tanımlayıp yeniden deploy edin.
          VITE_ENABLE_TURKISH: ${{ vars.VITE_ENABLE_TURKISH }}
      # GitHub Pages alt sayfalarda (ör. /product) yenilemede 404 döner; SPA'nın
      # istemci tarafı router'ı devralsın diye aynı index.html 404.html olarak da yayınlanır.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
